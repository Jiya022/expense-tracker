<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="top-bar">
    <h1>Expense Tracker</h1>
    <button class="logout-button" id="logoutBtn">Logout</button>
</div>

<div class="dashboard">
    <div class="left-panel">
        <div class="card">
            <div class="balance">
                <h2>Your Balance</h2>
                <p id="balance">₹0.00</p>
            </div>
            <div class="income-expense">
                <div>
                    <h3>Income</h3>
                    <p id="income">₹0.00</p>
                </div>
                <div class="expense">
                    <h3>Expenses</h3>
                    <p id="expense">₹0.00</p>
                </div>
            </div>
        </div>

        <div class="card form">
            <h3>Add Transaction</h3>

            <div class="form-control">
                <label>Type</label>
                <div class="type-toggle">
                    <button type="button" class="type-btn active" id="type-income" data-type="income">Income</button>
                    <button type="button" class="type-btn" id="type-expense" data-type="expense">Expense</button>
                </div>
            </div>

            <div class="form-control">
                <label for="text">Description</label>
                <input type="text" id="text" placeholder="Enter description">
            </div>
            <div class="form-control">
                <label for="amount">Amount</label>
                <input type="text" id="amount" placeholder="Enter amount">
            </div>
            <div class="form-control">
                <label for="category">Category</label>
                <select id="category">
                    <option value="Salary">Salary</option>
                    <option value="Food">Food</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other" selected>Other</option>
                </select>
            </div>
            <button class="btn" id="add-transaction">Add Transaction</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="card history">
            <div class="history-header">
                <h3>Transaction History</h3>
                <div class="form-control filter-control">
                    <label for="category-filter">Filter by category</label>
                    <select id="category-filter">
                        <option value="All" selected>All</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>

</html>
